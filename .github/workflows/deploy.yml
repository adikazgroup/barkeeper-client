name: Deploy Barkeepers Client to EC2

on:
  push:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────
  # Single job — SSH into EC2
  # Pull latest code from main branch
  # Install dependencies and build (768MB heap cap)
  # Prune dev dependencies
  # Reload existing PM2 process on port 3000
  # ─────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Pull latest code, build and reload PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd /var/www/barkeepers/barkeepers-client
            git fetch origin
            git checkout main
            git reset --hard origin/main
            npm install --ignore-scripts
            NODE_OPTIONS="--max-old-space-size=768" npm run build
            npm prune --omit=dev
            pm2 reload barkeepers-client || pm2 start npm --name "barkeepers-client" -- start -- --port 3000
            pm2 save
